services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-webserver:
    image: apache/airflow:2.9.1
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-key.json
    
    volumes:
      - ./requirements.txt:/requirements.txt
      - ../airflow-dataproc-exercises/dags:/opt/airflow/dags
      - ../airflow-dataproc-exercises/airflow-exercise-1/spark-jobs:/opt/airflow/spark-jobs
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
    ports:
      - "8080:8080"
    command: bash -c "pip install -r /requirements.txt && airflow db migrate && airflow users create --username admin --password admin --firstname Aishwarya --lastname K --role Admin --email admin@example.com || true && airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.9.1
    depends_on:
      - airflow-webserver
    
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-key.json
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./requirements.txt:/requirements.txt
      - ../airflow-dataproc-exercises/dags:/opt/airflow/dags
      - ../airflow-dataproc-exercises/airflow-exercise-1/spark-jobs:/opt/airflow/spark-jobs
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
    command: bash -c "pip install -r /requirements.txt && airflow scheduler"

volumes:
  postgres-db-volume: